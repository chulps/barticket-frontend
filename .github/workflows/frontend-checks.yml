name: Frontend checks

on:
  pull_request:
    branches: [main, feat/optimistic-ticket-edits, feat/optimistic-ticket-management]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read-only live menu translation audit (report missing database entries)
        if: github.head_ref == 'feature/ticket-item-actions-menu-translations-v2'
        continue-on-error: true
        run: npm run i18n:menu-audit
      - name: Verify deployed backend cover API (read-only)
        if: github.head_ref == 'feature/cover-waivers-returning-customers-v2'
        run: node scripts/verify-live-cover-contract.mjs
      - name: Frontend unit tests
        # The menu editor may ship only after Andrew's backend is deployed.
        # This gate performs GETs only; it never edits production menu data.
        run: node --test tests/*.test.mjs
      - name: Verify deployed menu editor API (read-only)
        if: github.head_ref == 'feature/menu-item-edit-archive-restore-81'
        run: node scripts/verify-live-menu-contract.mjs
      - name: Frontend security source audit
        run: node scripts/audit-frontend-security.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: Verify no source maps are published
        run: node scripts/audit-frontend-security.mjs --dist
      - name: ESLint (changed frontend files)
        run: npx eslint src/components/DataDownload.tsx src/pages/analyticsDataExport.ts src/hooks/useTickets.ts src/hooks/ticketRefreshPolicy.ts src/components/AddItemPicker.tsx src/components/quickEntry.ts src/components/topDrinks.ts src/pages/Dashboard.tsx src/components/TicketDetails/Ticket.tsx src/components/TicketDetails/TicketItems.tsx src/hooks/optimisticOperations.ts src/hooks/optimisticTickets.ts src/pages/Menu.tsx src/pages/Notifications.tsx src/App.tsx src/components/MenuCategory.tsx src/components/MenuItemRow.tsx src/components/topSellingItems.ts src/pages/Analytics.tsx src/pages/analyticsLegacy.ts src/pages/analyticsNavigation.ts src/pages/analyticsCurrentShift.ts src/pages/OpenShiftOverview.tsx src/components/AnalyticsCharts.tsx src/api/client.ts src/api/push.ts src/api/pushEvents.ts src/components/PushSettings.tsx src/hooks/refreshSafety.ts src/main.tsx src/pages/Admin.tsx src/pages/AdminTeam.tsx src/pages/AdminManagerShare.tsx src/pages/managerRevenueShare.ts src/pages/managerRevenueShareAccess.ts
