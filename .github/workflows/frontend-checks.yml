name: Frontend checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend unit tests
        run: node --test tests/*.test.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: ESLint (PWA and sync files)
        run: npx eslint src/hooks/useTickets.ts src/hooks/ticketRefreshPolicy.ts src/api/client.ts src/api/push.ts src/components/PushSettings.tsx src/pages/Notifications.tsx src/main.tsx
