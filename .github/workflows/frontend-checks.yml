name: Frontend checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend unit tests
        run: node --test tests/*.test.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: ESLint (changed frontend files)
        run: npx eslint src/hooks/useTickets.ts src/hooks/ticketRefreshPolicy.ts src/components/AddItemPicker.tsx src/components/quickEntry.ts src/components/TicketDetails/Ticket.tsx src/components/TicketDetails/TicketItems.tsx
