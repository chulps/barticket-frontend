name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate production API origin
        run: node scripts/validate-api-url.mjs
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Set under Settings > Secrets and variables > Actions > Secrets.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # UI allowlist IDs are public client-side values, not authorization.
          # Leave unset until real user IDs are verified. Private pay APIs must
          # enforce a separate server-side Chuck/Nori manager policy.
          VITE_REVENUE_SHARE_CHUCK_USER_ID: ${{ vars.VITE_REVENUE_SHARE_CHUCK_USER_ID }}
          VITE_REVENUE_SHARE_NORI_USER_ID: ${{ vars.VITE_REVENUE_SHARE_NORI_USER_ID }}

      - name: Reject unsafe build artifacts
        run: node scripts/audit-frontend-security.mjs --dist

      # GitHub Pages has no SPA rewrites; serve the app for deep links like /menu.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
