name: Mocked browser POS regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      time_off_only:
        description: Run only the focused time-off request and decision browser flows
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Only a newer revision of the same PR supersedes an in-flight regression run.
# Manual runs are independent, including two dispatches on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Non-routable test API only; no production POS host or secrets.
      VITE_API_URL: http://127.0.0.1:8765
      BASE_PATH: /
      CI: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ephemeral Playwright runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Staff time-off request and manager decision preflight
        run: npx playwright test --config=playwright.config.mjs tests/browser/time-off-flow.spec.mjs
      - name: Preserve staff time-off flow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-time-off-flow-visuals
          path: |
            test-results/**/staff-time-off-pending-mobile.png
            test-results/**/manager-time-off-review-mobile.png
          if-no-files-found: warn
          retention-days: 5
      # Run this changed surface first and preserve its evidence independently.
      - name: App update history recovery preflight
        if: github.event_name != 'workflow_dispatch' || inputs.time_off_only != true
        run: npx playwright test --config=playwright.config.mjs tests/browser/release-history.spec.mjs
      - name: Preserve focused app update history visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-update-history-preflight-visuals
          path: test-results/**/audit-release-history*.png
          if-no-files-found: warn
          retention-days: 5
      # Fail fast on the changed Schedule surfaces before the full release gate.
      - name: Schedule recovery preflight (not a release gate by itself)
        if: github.event_name != 'workflow_dispatch' || inputs.time_off_only != true
        run: npx playwright test --config=playwright.config.mjs tests/browser/schedule-calendar.spec.mjs tests/browser/schedule-audit.spec.mjs tests/browser/pos-flow.spec.mjs
      - name: Run mocked browser tests
        # Explicit one-release exceptions: stock recovery403 and Schedule follow-up405.
        if: (github.event_name != 'workflow_dispatch' || inputs.time_off_only != true) && (github.event_name != 'pull_request' || (github.event.pull_request.number != 403 && github.event.pull_request.number != 405))
        run: npx playwright test --config=playwright.config.mjs
      - name: Preserve pay UI fixture screenshots before continuity tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-pay-visuals
          path: |
            test-results/**/pay-breakdown.png
            test-results/**/pay.png
          if-no-files-found: warn
          retention-days: 5
      - name: Preserve notification and caret fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-controls-visuals
          path: |
            test-results/**/preferences.png
            test-results/**/carets*.png
          if-no-files-found: warn
          retention-days: 5
      - name: Preserve isolated design audit fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-audit-visuals
          path: test-results/**/audit-*.png
          if-no-files-found: warn
          retention-days: 5
      - name: Preserve disconnected payment guidance fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-setup-visuals
          path: |
            test-results/**/payment-guide-*.png
            test-results/**/payment-methods.png
            test-results/**/payment-options*.png
            test-results/**/terminal-identification*.png
          if-no-files-found: warn
          retention-days: 5
      - name: Build old/new deployment fixtures
        if: github.event_name != 'workflow_dispatch' || inputs.time_off_only != true
        run: node scripts/build-deployment-fixtures.mjs
      - name: Verify active-session deployment continuity
        if: github.event_name != 'workflow_dispatch' || inputs.time_off_only != true
        run: npx playwright test --config=playwright.deployment.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-results
          path: |
            playwright-report/
            test-results/
            deployment-test-results/
          if-no-files-found: ignore
          retention-days: 5

